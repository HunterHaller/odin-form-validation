<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form of Validating</title>
</head>

<body>
    <h1 class="centered">FORM OF VALIDATING</h1>
    <p class="centered">Present herein thine information, and let only truth pass through your fingers, for the gods are watching.</p>

    <form novalidate>
        <label for="email">Address whence another might send thee an "electronic mail":</label>
        <input type="email" id="email" name="email">
        <span class="error" id="emailError" aria-live="polite"></span>
        <br>
        <label for="country">The land in which ye reside:</label>
        <select type="select" id="country" name="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="mexico">Mexico</option>
            <option value="other">Other</option>
        </select>
        <br>
        <label for="postal-code">Thine area number, as assigned by the post:</label>
        <input type="number" id="postal-code" name="postal-code">
        <br>
        <label for="password">A password most secret and unique:</label>
        <input type="text" id="password" name="password">
        <br>
        <label for="password-confirm">That same password, once more:</label>
        <input type="text" id="password-confirm" name="password-confirm">
        <br>
        <button>Submit your answers</button>
    </form>
</body>

</html>
